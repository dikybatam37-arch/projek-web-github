
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang Diky</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .deskripsi {
            margin-top: 25px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Selamat Datang Diky</h1>
        <p style="text-align:center;">
            Silakan isi data di bawah ini.
        </p>

        <form onsubmit="event.preventDefault(); alert('Form berhasil diisi!');">
            <label for="nama">Nama</label>
            <input type="text" id="nama"
                   placeholder="Masukkan nama" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Masukkan password" required>

            <label for="gmail">Gmail</label>
            <input type="email" id="gmail"
                   placeholder="Masukkan email" required>

            <button type="submit">Kirim</button>
        </form>

        <div class="deskripsi">
            <h3>Deskripsi Projek</h3>
            <p>
                Website ini dibuat untuk belajar HTML dan CSS,
                serta memahami cara membuat formulir dan
                desain halaman web sederhana.
            </p>
        </div>
    </div>

</body>
</html>
